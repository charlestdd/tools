<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools at Klazco</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --text: #1a1a1a;
            --muted: #666666;
            --border: #e5e7eb;
            --accent: #000000;
            --accent-text: #ffffff;
            --card-hover: translateY(-4px);
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg: #0f0f11;
            --surface: #18181b;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --border: #27272a;
            --accent: #ffffff;
            --accent-text: #000000;
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, transform 0.2s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .theme-toggle {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 99px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .brand {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--muted);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 960px;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow);
        }

        .card:hover {
            transform: var(--card-hover);
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .card p {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent);
            color: var(--accent-text);
            text-decoration: none;
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            width: 100%;
            text-align: center;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">Dark Mode</button>

    <header>
        <p class="brand">Klazco</p>
        <h1>Tools Directory</h1>
    </header>

    <main class="grid">
        <div class="card">
            <div>
                <h2>Post Generator</h2>
                <p>Create clean, engaging content tailored for your social feeds.</p>
            </div>
            <a href="/tools" class="btn">Go</a>
        </div>

        <div class="card">
            <div>
                <h2>Email Generator</h2>
                <p>Draft professional emails and outreach messages effortlessly.</p>
            </div>
            <a href="#" class="btn">Go</a>
        </div>

        <div class="card">
            <div>
                <h2>Profile Generator</h2>
                <p>Build cohesive bios and structural profiles in seconds.</p>
            </div>
            <a href="#" class="btn">Go</a>
        </div>
    </main>

    <script>
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeToggle');
            
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                btn.textContent = 'Dark Mode';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = 'Light Mode';
            }
        }
    </script>
</body>
</html>
